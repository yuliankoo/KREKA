<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobsy.sk — Aplikácia</title>
<meta name="theme-color" content="#0A0A14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0A14'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%237C5CFF'/%3E%3Ccircle cx='21' cy='16' r='4' fill='%23FFD84D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Space+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A14;--panel:#10101E;--panel2:#161628;
  --paper:#EEF0FF;--mute:rgba(238,240,255,.5);
  --vio:#7C5CFF;--cyan:#3DE8FF;--sun:#FFD84D;
  --ok:#4ADE80;--bad:#FF6B6B;
  --rule:rgba(238,240,255,.12);
  --display:'Unbounded',sans-serif;--body:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 50% at 80% 0%,rgba(124,92,255,.13),transparent 60%),
             radial-gradient(50% 40% at 10% 100%,rgba(61,232,255,.07),transparent 60%)}
#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--sun);color:var(--bg)}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--paper);background:var(--panel2);
  border:1px solid var(--rule);border-radius:12px;padding:.8rem 1rem;width:100%;outline:none;
  transition:border-color .25s}
input:focus,select:focus,textarea:focus{border-color:var(--vio)}
textarea{resize:vertical;min-height:90px}
label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);display:block;margin:.9rem 0 .4rem}

/* ---------- topbar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:.9rem clamp(16px,3vw,32px);border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:rgba(10,10,20,.85);backdrop-filter:blur(10px);z-index:20}
.logo{font-family:var(--display);font-weight:800;font-size:1.05rem;text-decoration:none}
.logo b{color:var(--sun)}
.top nav{display:flex;gap:.4rem;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:.55rem .95rem;border-radius:100px;color:var(--mute);transition:.25s}
.tab:hover{color:var(--paper)}
.tab.on{background:var(--vio);color:#fff}
.tab .bdg{display:inline-block;min-width:17px;text-align:center;background:var(--sun);color:var(--bg);
  border-radius:100px;font-size:9.5px;padding:1px 4px;margin-left:5px;font-weight:500}
.uchip{display:flex;align-items:center;gap:.7rem;font-family:var(--mono);font-size:11px}
.uchip .role{color:var(--sun);letter-spacing:.1em;text-transform:uppercase}
.uchip button{color:var(--mute);text-decoration:underline;text-underline-offset:3px}
.uchip button:hover{color:var(--bad)}

/* ---------- layout ---------- */
.page{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,36px)}
.h-page{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);
  letter-spacing:-.02em;margin-bottom:.4rem}
.sub{color:var(--mute);font-size:.95rem;margin-bottom:1.8rem}
.grid{display:grid;gap:1rem}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* ---------- cards ---------- */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:1.4rem}
.stat .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.stat .v{font-family:var(--display);font-weight:600;font-size:2rem;margin-top:.4rem}
.stat .v small{font-size:.9rem;color:var(--mute);font-family:var(--body);font-weight:300}
.jcard{display:flex;flex-direction:column;gap:.7rem}
.jcard h3{font-family:var(--display);font-weight:600;font-size:1.05rem;letter-spacing:-.01em}
.jcard .pay{font-family:var(--mono);font-size:12.5px;color:var(--sun)}
.jcard p{font-size:.9rem;line-height:1.55;color:var(--mute)}
.jmeta{display:flex;flex-wrap:wrap;gap:.45rem}
.pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;border:1px solid var(--rule);
  border-radius:100px;padding:.3rem .7rem;color:var(--mute)}
.pill.vio{border-color:rgba(124,92,255,.5);color:var(--vio)}
.jfoot{display:flex;justify-content:space-between;align-items:center;gap:.8rem;
  border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.2rem}
.jfoot .co{font-family:var(--mono);font-size:11px;color:var(--mute)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;padding:.75rem 1.3rem;border-radius:100px;
  transition:.25s;text-decoration:none;white-space:nowrap}
.btn.p{background:var(--sun);color:var(--bg)}
.btn.p:hover{background:var(--vio);color:#fff}
.btn.g{border:1px solid var(--rule);color:var(--paper)}
.btn.g:hover{border-color:var(--sun);color:var(--sun)}
.btn.ok{background:rgba(74,222,128,.14);color:var(--ok);border:1px solid rgba(74,222,128,.35)}
.btn.no{background:rgba(255,107,107,.12);color:var(--bad);border:1px solid rgba(255,107,107,.3)}
.btn.s{padding:.5rem .9rem;font-size:10px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
.fchip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;border:1px solid var(--rule);
  border-radius:100px;padding:.5rem 1rem;color:var(--mute);transition:.25s}
.fchip.on{background:var(--vio);border-color:var(--vio);color:#fff}
.filters input,.filters select{width:auto;min-width:150px;padding:.5rem .9rem;border-radius:100px;font-size:.88rem}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--mute);text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--rule)}
.tbl td{padding:.75rem .8rem;border-bottom:1px solid var(--rule);vertical-align:middle}
.tbl tr:hover td{background:rgba(238,240,255,.025)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border-radius:100px;padding:.25rem .6rem}
.tag.worker{background:rgba(61,232,255,.12);color:var(--cyan)}
.tag.company{background:rgba(124,92,255,.16);color:#B9A5FF}
.tag.admin{background:rgba(255,216,77,.14);color:var(--sun)}
.tag.wait{background:rgba(238,240,255,.08);color:var(--mute)}
.tag.ok{background:rgba(74,222,128,.14);color:var(--ok)}
.tag.no{background:rgba(255,107,107,.12);color:var(--bad)}
.tag.off{background:rgba(255,107,107,.12);color:var(--bad)}
.tag.act{background:rgba(74,222,128,.14);color:var(--ok)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:2rem}
.auth-card{width:min(94vw,420px);background:var(--panel);border:1px solid var(--rule);
  border-radius:22px;padding:clamp(1.6rem,4vw,2.4rem)}
.auth-card .logo{font-size:1.4rem;display:block;margin-bottom:.4rem}
.auth-card .sub{margin-bottom:1.2rem}
.demo{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.seg{display:flex;gap:.4rem;margin:.4rem 0 .2rem}
.seg button{flex:1;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:12px;padding:.7rem;color:var(--mute);transition:.25s}
.seg button.on{background:var(--vio);border-color:var(--vio);color:#fff}
.err{color:var(--bad);font-size:.85rem;margin-top:.8rem;font-family:var(--mono)}
.note{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mute);
  margin-top:1.1rem;line-height:1.6}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-columns:260px 1fr;gap:0;border:1px solid var(--rule);
  border-radius:18px;overflow:hidden;height:min(64vh,560px);background:var(--panel)}
.contacts{border-right:1px solid var(--rule);overflow-y:auto}
.contact{display:flex;flex-direction:column;gap:.15rem;width:100%;text-align:left;
  padding:.9rem 1rem;border-bottom:1px solid var(--rule);transition:.2s}
.contact:hover{background:rgba(238,240,255,.03)}
.contact.on{background:rgba(124,92,255,.14)}
.contact .n{font-weight:400;font-size:.92rem}
.contact .r{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.thread{display:flex;flex-direction:column}
.msgs{flex:1;overflow-y:auto;padding:1.1rem;display:flex;flex-direction:column;gap:.55rem}
.msg{max-width:76%;padding:.6rem .9rem;border-radius:14px;font-size:.9rem;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--vio);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--rule);border-bottom-left-radius:4px}
.msg .t{display:block;font-family:var(--mono);font-size:9px;opacity:.6;margin-top:.25rem}
.composer{display:flex;gap:.6rem;padding:.8rem;border-top:1px solid var(--rule)}
.composer input{border-radius:100px}
.empty{color:var(--mute);font-size:.9rem;display:grid;place-items:center;height:100%;padding:2rem;text-align:center}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(6,6,12,.72);backdrop-filter:blur(4px);
  display:grid;place-items:center;z-index:40;padding:1.2rem}
.modal{width:min(94vw,520px);background:var(--panel);border:1px solid var(--rule);
  border-radius:20px;padding:1.8rem;max-height:88vh;overflow-y:auto}
.modal h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin-bottom:.4rem}

.banner{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--bg);
  background:var(--sun);text-align:center;padding:.45rem .8rem}

@media(max-width:1120px) and (min-width:761px){
  .page{padding:clamp(16px,2.5vw,28px)}
  .g2{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .chat{grid-template-columns:1fr;height:72vh}
  .contacts{display:flex;overflow-x:auto;border-right:none;border-bottom:1px solid var(--rule)}
  .contact{min-width:150px;border-bottom:none;border-right:1px solid var(--rule)}
  .top{padding:.7rem 14px}
  .top nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .top nav::-webkit-scrollbar{display:none}
  .tab{padding:.5rem .8rem;white-space:nowrap}
  .uchip{font-size:10px;gap:.5rem}
  .page{padding:16px 14px 60px}
  .panel{padding:1.1rem;overflow-x:auto}
  .tbl{font-size:.82rem;min-width:520px}
  .tbl th,.tbl td{padding:.55rem .55rem}
  .h-page{font-size:1.3rem}
  .stat .v{font-size:1.6rem}
  .modal{padding:1.3rem}
  .msg{max-width:88%}
  .filters input,.filters select{flex:1;min-width:0}
}

/* ===== zladenie s webom ===== */
#dots{position:fixed;inset:0;z-index:0;pointer-events:none}
#wipe{position:fixed;inset:0;z-index:80;pointer-events:none;
  background:linear-gradient(120deg,var(--vio),#12122a 55%,var(--sun));
  transform-origin:top;transform:scaleY(1);
  transition:transform .6s cubic-bezier(.83,0,.17,1)}
#wipe.off{transform:scaleY(0)}
#wipe.out{transform-origin:bottom;transform:scaleY(1);transition-duration:.5s}
@media(prefers-reduced-motion:reduce){#wipe{display:none}}

.h-page{background:linear-gradient(100deg,var(--paper) 25%,var(--vio) 62%,var(--cyan) 95%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.banner{background:linear-gradient(90deg,rgba(124,92,255,.30),rgba(61,232,255,.20));color:var(--paper)}
.panel{background:linear-gradient(180deg,rgba(26,27,48,.72),rgba(12,13,24,.82));border-radius:18px}
.auth{position:relative;overflow:hidden}
.auth::before,.auth::after{content:'';position:absolute;border-radius:50%;
  filter:blur(70px);pointer-events:none;opacity:.55}
.auth::before{width:420px;height:420px;left:-120px;top:-80px;
  background:radial-gradient(circle,rgba(124,92,255,.45),transparent 70%)}
.auth::after{width:380px;height:380px;right:-100px;bottom:-80px;
  background:radial-gradient(circle,rgba(61,232,255,.30),transparent 70%)}
.auth-card{background:linear-gradient(180deg,rgba(26,27,48,.82),rgba(12,13,24,.90));
  backdrop-filter:blur(12px);border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.45)}
.top .logo:hover b{color:var(--cyan)}
.tab:hover{color:var(--sun)}
</style>

<script>
(function(){
'use strict';
const sb=(typeof supabase!=='undefined'&&window.SB_URL)?supabase.createClient(window.SB_URL,window.SB_KEY):null;

/* ---- skutočné dáta zo Supabase ---- */
let R={jobs:[],apps:[],msgs:[],contacts:[],users:[],alljobs:[],stats:null};
function njob(r){return{id:r.id,companyId:r.company_id,title:r.title,cat:r.cat,city:r.city,
  type:r.type||'brigáda',pay:r.pay,desc:r.descr||'',active:r.active,
  companyName:r.company_name||(r.company&&r.company.name)||'—',
  when:r.when_txt||'',start:r.start_txt||'',spots:r.spots||1,
  tasks:r.tasks||'',reqs:r.req||'',perks:r.perks||''}}
async function loadRealData(){
  if(!me||!me.real||!sb)return;
  try{
    const {data:jobs}=await sb.from('jobs')
      .select('*, company:profiles!jobs_company_id_fkey(name)')
      .order('created_at',{ascending:false});
    R.jobs=(jobs||[]).map(njob);
    if(me.role==='worker'){
      const {data:apps}=await sb.from('applications')
        .select('*, job:jobs(id,title,company_id,company_name)')
        .eq('worker_id',me.id).order('created_at',{ascending:false});
      R.apps=(apps||[]).map(a=>({id:a.id,jobId:a.job_id,workerId:a.worker_id,status:a.status,
        ts:new Date(a.created_at).getTime(),
        jobTitle:a.job?a.job.title:'—',
        companyId:a.job?a.job.company_id:null,
        companyName:a.job?(a.job.company_name||'—'):'—'}));
    }else{
      const {data:apps}=await sb.from('applications')
        .select('*, worker:profiles!applications_worker_id_fkey(name,city), job:jobs(id,company_id,title)')
        .order('created_at',{ascending:false});
      R.apps=(apps||[]).filter(a=>a.job&&a.job.company_id===me.id)
        .map(a=>({id:a.id,jobId:a.job_id,workerId:a.worker_id,status:a.status,
          ts:new Date(a.created_at).getTime(),jobTitle:a.job?a.job.title:'—',
          workerName:a.worker?a.worker.name:'—',workerCity:a.worker?(a.worker.city||'—'):'—'}));
    }
  }catch(e){console.error('loadRealData',e);}
}
async function loadRealChat(){
  if(!me||!me.real||!sb)return;
  try{
    const {data:msgs}=await sb.from('messages').select('*').order('created_at',{ascending:true});
    R.msgs=(msgs||[]).map(m=>({id:m.id,from:m.sender_id,to:m.receiver_id,
      text:m.body,ts:new Date(m.created_at).getTime()}));
    const ids=new Set();
    R.msgs.forEach(m=>{ids.add(m.from);ids.add(m.to);});
    if(me.role==='worker')R.apps.forEach(a=>{if(a.companyId)ids.add(a.companyId);});
    if(me.role==='company')R.apps.forEach(a=>ids.add(a.workerId));
    ids.delete(me.id);
    if(me.role==='admin'){
      const {data:ps}=await sb.from('profiles').select('id,name,role,city').neq('id',me.id).limit(200);
      R.contacts=ps||[];
    }else if(ids.size){
      const {data:ps}=await sb.from('profiles').select('id,name,role,city').in('id',[...ids]);
      R.contacts=ps||[];
    }else R.contacts=[];
  }catch(e){console.error('loadRealChat',e);}
}
async function loadAdminData(){
  if(!me||!me.real||me.role!=='admin'||!sb)return;
  try{
    const [{data:users},{data:jobs},{count:apps},{count:msgs}]=await Promise.all([
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('jobs').select('*').order('created_at',{ascending:false}),
      sb.from('applications').select('*',{count:'exact',head:true}),
      sb.from('messages').select('*',{count:'exact',head:true})
    ]);
    R.users=users||[];
    R.alljobs=(jobs||[]).map(j=>({id:j.id,companyId:j.company_id,companyName:j.company_name||'—',
      title:j.title,cat:j.cat,city:j.city,active:j.active}));
    R.stats={users:R.users.length,
      workers:R.users.filter(u=>u.role==='worker').length,
      companies:R.users.filter(u=>u.role==='company').length,
      blocked:R.users.filter(u=>u.blocked).length,
      jobs:R.alljobs.length,activeJobs:R.alljobs.filter(j=>j.active).length,
      apps:apps||0,msgs:msgs||0};
  }catch(e){console.error('loadAdminData',e);}
}
let chatSubbed=false;
function subscribeChat(){
  if(chatSubbed||!sb||!me||!me.real)return;
  chatSubbed=true;
  sb.channel('jobsy-msgs')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{
      const m=p.new;
      if(m.sender_id!==me.id&&m.receiver_id!==me.id)return;
      if(R.msgs.some(x=>x.id===m.id))return;
      R.msgs.push({id:m.id,from:m.sender_id,to:m.receiver_id,
        text:m.body,ts:new Date(m.created_at).getTime()});
      const other=m.sender_id===me.id?m.receiver_id:m.sender_id;
      const done=()=>{if(!modal)render();};
      if(!R.contacts.some(c=>c.id===other))loadRealChat().then(done);
      else done();
    }).subscribe();
}

let me=null, tab='overview', chatWith=null, modal=null, err='';

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=id=>DB.users.find(u=>u.id===id);
const fmtT=ts=>{
  const d=new Date(ts),n=new Date();
  const same=d.toDateString()===n.toDateString();
  return (same?'dnes ':'')+d.toLocaleDateString('sk-SK',same?{}:{day:'numeric',month:'numeric'})+
    (same?'':' ')+d.toLocaleTimeString('sk-SK',{hour:'2-digit',minute:'2-digit'});
};
function myContacts(){
  if(me.role==='admin')return DB.users.filter(u=>u.id!==me.id);
  const ids=new Set();
  if(me.role==='worker'){
    DB.apps.filter(a=>a.workerId===me.id).forEach(a=>{
      const j=DB.jobs.find(j=>j.id===a.jobId); if(j)ids.add(j.companyId);
    });
  }else{
    DB.apps.forEach(a=>{
      const j=DB.jobs.find(j=>j.id===a.jobId);
      if(j&&j.companyId===me.id)ids.add(a.workerId);
    });
  }
  DB.msgs.forEach(m=>{
    if(m.from===me.id)ids.add(m.to);
    if(m.to===me.id)ids.add(m.from);
  });
  ids.add(1); ids.delete(me.id);
  return [...ids].map(U).filter(Boolean);
}
const thread=(a,b)=>DB.msgs.filter(m=>(m.from===a&&m.to===b)||(m.from===b&&m.to===a)).sort((x,y)=>x.ts-y.ts);
const msgCount=()=>(me&&me.real)?R.msgs.filter(m=>m.to===me.id).length:DB.msgs.filter(m=>m.to===me.id).length;

window.act={
  async login(e){
    e.preventDefault();
    const em=$('#f-email').value.trim().toLowerCase(),pw=$('#f-pass').value;
    if(!sb){err='Supabase klient sa nenačítal — skontroluj pripojenie.';render();return;}
    err='Prihlasujem…';render();
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){err='Nesprávny e-mail alebo heslo.';render();return;}
    await loadRealProfile(data.user);
  },
  demo(id){me=U(id);err='';tab='overview';render();},
  toReg(v){regMode=v;err='';render();},
  setRole(r){regRole=r;render();},
  async register(e){
    e.preventDefault();
    const n=$('#r-name').value.trim(),em=$('#r-email').value.trim(),pw=$('#r-pass').value;
    if(!n||!em||pw.length<6){err='Vyplň meno, e-mail a heslo (min. 6 znakov).';render();return;}
    if(!sb){err='Supabase klient sa nenačítal — skontroluj pripojenie.';render();return;}
    err='Vytváram účet…';render();
    const {data,error}=await sb.auth.signUp({email:em,password:pw,
      options:{data:{role:regRole,name:n,city:$('#r-city').value}}});
    if(error){err=error.message.includes('already')?'Tento e-mail už existuje.':'Registrácia zlyhala: '+error.message;render();return;}
    if(!data.session){err='';regMode=false;
      alert('Účet vytvorený! Skontroluj si e-mail a potvrď registráciu, potom sa prihlás.');render();return;}
    await loadRealProfile(data.user);
  },
  logout(){if(sb)sb.auth.signOut();me=null;chatWith=null;regMode=false;render();},
  tab(t){tab=t;render();},
  filtCat(c){f.cat=c;render();},
  filt(){f.city=$('#f-city').value;f.q=$('#f-q').value;render();},
  async apply(jobId){
    if(me.real){
      const {error}=await sb.from('applications').insert({job_id:jobId,worker_id:me.id});
      if(error&&!/duplicate|unique/i.test(error.message)){alert('Prihlásenie zlyhalo: '+error.message);return;}
      await loadRealData();render();return;
    }
    if(DB.apps.some(a=>a.jobId===jobId&&a.workerId===me.id))return;
    DB.apps.push({id:++uid,jobId,workerId:me.id,status:'wait',ts:Date.now()});
    render();
  },
  async decide(appId,st){
    if(me.real){
      const a=R.apps.find(a=>a.id===appId);
      const {error}=await sb.from('applications').update({status:st}).eq('id',appId);
      if(error){alert('Nepodarilo sa uložiť: '+error.message);return;}
      if(a){
        const txt=st==='ok'
          ?`Tvoja prihláška na „${a.jobTitle}" bola prijatá 🎉 Ozvi sa mi tu v správach ohľadom nástupu.`
          :`Ďakujeme za prihlášku na „${a.jobTitle}", tentokrát sme vybrali niekoho iného. Skús ďalšie ponuky!`;
        await sb.from('messages').insert({sender_id:me.id,receiver_id:a.workerId,body:txt});
      }
      await loadRealData();await loadRealChat();render();return;
    }
    const a=DB.apps.find(a=>a.id===appId);if(!a)return;
    a.status=st;
    const j=DB.jobs.find(j=>j.id===a.jobId);
    DB.msgs.push({id:++uid,from:me.id,to:a.workerId,ts:Date.now(),
      text:st==='ok'
        ?`Tvoja prihláška na „${j.title}" bola prijatá 🎉 Ozvi sa mi tu v správach ohľadom nástupu.`
        :`Ďakujeme za prihlášku na „${j.title}", tentokrát sme vybrali niekoho iného. Skús ďalšie ponuky!`});
    render();
  },
  openJobForm(job){modal={type:'job',job:job||null};render();},
  editJob(id){
    const src=(me&&me.real)?R.jobs:DB.jobs;
    const j=src.find(x=>x.id===id);
    if(j)act.openJobForm(j);
  },
  async saveJob(e){
    e.preventDefault();
    const t=$('#j-title').value.trim(),d=$('#j-desc').value.trim(),p=$('#j-pay').value.trim();
    if(!t||!d||!p){return;}
    const extra={type:$('#j-type').value,when:$('#j-when').value.trim(),start:$('#j-start').value.trim(),
      spots:Math.max(1,parseInt($('#j-spots').value)||1),
      tasks:$('#j-tasks').value.trim(),reqs:$('#j-req').value.trim(),perks:$('#j-perks').value.trim()};
    if(me.real){
      const rec={title:t,descr:d,pay:p,cat:$('#j-cat').value,city:$('#j-city').value,
        type:extra.type,when_txt:extra.when,start_txt:extra.start,spots:extra.spots,
        tasks:extra.tasks,req:extra.reqs,perks:extra.perks,
        company_id:me.id,company_name:me.name};
      const q=modal.job?sb.from('jobs').update(rec).eq('id',modal.job.id):sb.from('jobs').insert(rec);
      const {error}=await q;
      if(error){alert('Uloženie zlyhalo: '+error.message);return;}
      modal=null;await loadRealData();render();return;
    }
    if(modal.job){
      Object.assign(modal.job,{title:t,desc:d,pay:p,cat:$('#j-cat').value,city:$('#j-city').value},extra);
    }else{
      DB.jobs.unshift(Object.assign({id:++uid,companyId:me.id,title:t,desc:d,pay:p,
        cat:$('#j-cat').value,city:$('#j-city').value,active:true},extra));
    }
    modal=null;render();
  },
  async toggleJob(id){
    if(me.real){
      const j=R.jobs.find(j=>j.id===id)||R.alljobs.find(j=>j.id===id);if(!j)return;
      await sb.from('jobs').update({active:!j.active}).eq('id',id);
      await loadRealData();if(me.role==='admin')await loadAdminData();render();return;
    }
    const j=DB.jobs.find(j=>j.id===id);if(j)j.active=!j.active;render();
  },
  async delJob(id){
    if(me.real){
      if(!confirm('Naozaj zmazať inzerát? Zmiznú aj prihlášky naň.'))return;
      await sb.from('jobs').delete().eq('id',id);
      await loadRealData();if(me.role==='admin')await loadAdminData();render();return;
    }
    DB.jobs=DB.jobs.filter(j=>j.id!==id);
    DB.apps=DB.apps.filter(a=>a.jobId!==id);
    render();
  },
  closeModal(){modal=null;render();},
  chat(id){chatWith=(me&&me.real)?id:+id;tab='chat';render();},
  async send(e){
    e.preventDefault();
    const inp=$('#c-inp'),txt=inp.value.trim();
    if(!txt||!chatWith)return;
    if(me.real){
      inp.value='';
      const {data,error}=await sb.from('messages')
        .insert({sender_id:me.id,receiver_id:chatWith,body:txt}).select().single();
      if(error){alert('Odoslanie zlyhalo: '+error.message);return;}
      if(data&&!R.msgs.some(x=>x.id===data.id))
        R.msgs.push({id:data.id,from:data.sender_id,to:data.receiver_id,
          text:data.body,ts:new Date(data.created_at).getTime()});
      render();return;
    }
    DB.msgs.push({id:++uid,from:me.id,to:chatWith,text:txt,ts:Date.now()});
    inp.value='';render();
    const other=chatWith;
    const canned=AUTOREPLY[other];
    if(canned&&other!==me.id){
      setTimeout(()=>{
        DB.msgs.push({id:++uid,from:other,to:me.id,ts:Date.now(),
          text:canned[(Math.random()*canned.length)|0]});
        if(me&&tab==='chat')render();
      },1400+Math.random()*1200);
    }
  },
  async block(id){
    if(me.real){
      const u=R.users.find(u=>u.id===id);if(!u||u.role==='admin')return;
      await sb.from('profiles').update({blocked:!u.blocked}).eq('id',id);
      await loadAdminData();render();return;
    }
    const u=U(id);if(u&&u.role!=='admin')u.blocked=!u.blocked;render();
  },
  async delUser(id){
    if(me.real){
      const u=R.users.find(u=>u.id===id);if(!u||u.role==='admin')return;
      if(!confirm('Naozaj zmazať používateľa? Zmiznú aj jeho inzeráty, prihlášky a správy.'))return;
      await sb.from('profiles').delete().eq('id',id);
      await loadAdminData();await loadRealChat();render();return;
    }
    const u=U(id);if(!u||u.role==='admin')return;
    DB.users=DB.users.filter(x=>x.id!==id);
    DB.jobs=DB.jobs.filter(j=>j.companyId!==id);
    DB.apps=DB.apps.filter(a=>a.workerId!==id&&DB.jobs.some(j=>j.id===a.jobId));
    DB.msgs=DB.msgs.filter(m=>m.from!==id&&m.to!==id);
    if(chatWith===id)chatWith=null;
    render();
  }
};

  me={id:user.id,real:true,email:user.email,

<script>
(function(){
'use strict';
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* prechod stránky: vstup aj odchod */
const wipe=document.getElementById('wipe');
requestAnimationFrame(()=>requestAnimationFrame(()=>wipe.classList.add('off')));
document.addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;
  const href=a.getAttribute('href')||'';
  if(!/^(index|ponuky|podmienky|sukromie)\.html/.test(href))return;
  if(e.ctrlKey||e.metaKey||a.target==='_blank')return;
  e.preventDefault();
  if(REDUCED){location.href=href;return;}
  wipe.classList.remove('off');wipe.classList.add('out');
  setTimeout(()=>{location.href=href;},480);
});
addEventListener('pageshow',e=>{if(e.persisted){wipe.classList.add('off');wipe.classList.remove('out');}});

/* ambientné bodky + aura za kurzorom — rovnaké ako na webe, len jemnejšie */
if(!REDUCED){
  const cv=document.getElementById('dots'),ctx=cv.getContext('2d');
  const N=innerWidth<700?50:110;
  let W,H;
  function size(){
    W=cv.width=innerWidth*devicePixelRatio;
    H=cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  }
  size();addEventListener('resize',size);
  const dots=Array.from({length:N},()=>({x:Math.random(),y:Math.random(),
    vx:(Math.random()-.5)*.0004,vy:(Math.random()-.5)*.0004,
    r:.6+Math.random()*1.4,s:Math.random()*6.28}));
  let mx=-1e4,my=-1e4,sx=innerWidth/2,sy=innerHeight/2;
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;});
  function frame(t){
    requestAnimationFrame(frame);
    if(document.hidden)return;
    ctx.clearRect(0,0,W,H);
    const dpr=devicePixelRatio;
    sx+=(((mx>-9000)?mx:innerWidth/2)-sx)*.055;
    sy+=(((my>-9000)?my:innerHeight/2)-sy)*.055;
    if(mx>-9000){
      const g=ctx.createRadialGradient(sx*dpr,sy*dpr,0,sx*dpr,sy*dpr,220*dpr);
      g.addColorStop(0,'rgba(124,92,255,.07)');
      g.addColorStop(.55,'rgba(61,232,255,.025)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    }
    for(const d of dots){
      d.x+=d.vx;d.y+=d.vy;
      if(d.x<0||d.x>1)d.vx*=-1;
      if(d.y<0||d.y>1)d.vy*=-1;
      const par=(d.r-.6)/1.4;
      const px=d.x*innerWidth+(sx-innerWidth/2)*.025*par,
            py=d.y*innerHeight+(sy-innerHeight/2)*.025*par;
      const dist=Math.hypot(px-mx,py-my);
      const glow=Math.max(0,1-dist/180);
      const tw=.18+.12*Math.sin(t*.001+d.s);
      ctx.beginPath();
      ctx.arc(px*dpr,py*dpr,(d.r+glow*1.6)*dpr,0,6.283);
      ctx.fillStyle=glow>0
        ?`rgba(124,92,255,${(tw+glow*.5).toFixed(3)})`
        :`rgba(238,240,255,${(tw*.4).toFixed(3)})`;
      ctx.fill();
    }
  }
  requestAnimationFrame(frame);
}
})();
</script>
